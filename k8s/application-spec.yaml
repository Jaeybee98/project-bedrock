apiVersion: v1
kind: Namespace
metadata:
  name: retail-app
  labels:
    Project: karatu-2025-capstone
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-ui
  namespace: retail-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-ui
  template:
    metadata:
      labels:
        app: retail-ui
    spec:
      containers:
      - name: ui
        image: public.ecr.aws/aws-containers/retail-store-sample-app-ui:0.5.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: retail-ui-service
  namespace: retail-app
spec:
  type: NodePort
  selector:
    app: retail-ui
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
# =======================================================
# THE ENTERPRISE ALB INGRESS CONTROLLER RESOURCE
# =======================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-bedrock-ingress
  namespace: retail-app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Bonus 5.2 Option placeholder: Un-comment and insert ACM Cert ARN if using TLS
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:XXXXXX:certificate/XXXXXX
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: retail-ui-service
            port:
              number: 80
